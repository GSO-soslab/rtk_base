# Base station whose receiver is configured with its own tools (for example a
# SparkFun RTK Surveyor in base mode).  The driver forwards the RTCM the
# receiver outputs on this port and parses its NMEA.  The receiver must output
# RTCM on the port connected to this computer; for the Surveyor see "SparkFun
# RTK Surveyor as base" in the README.
/**:
  ros__parameters:
    # Stable name of the Surveyor's Configure u-blox USB port: /dev/ttyACM0 can be
    # another device after a reboot. The name has no serial number, so it fits one
    # u-blox receiver per computer. Data port on a UART: for example /dev/ttyAMA0.
    device: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
    baudrate: 115200
    gps_frame_id: rtk_base

    # Stamp ~/fix with GNSS time instead of arrival time
    # use_gnss_time: true

    # NMEA to gpsd for the computer clock (README, Time from GNSS); same port as
    # DEVICES="udp://127.0.0.1:<port>" in /etc/default/gpsd
    # use_gpsd_udp: true
    # virtual_port: 5005

    receiver: generic

    rtcm:
      # add 'udp://<broadcast address>:2101' to also broadcast on the local network
      outputs: ['tcpserver://0.0.0.0:2101']
